<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo animation</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif}
#wrap{position:absolute;inset:0 0 56px 0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
.scene{position:absolute;inset:0;overflow:hidden}
#bar{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;box-sizing:border-box;color:#eee;background:#1b1b1b}
#bar button{background:#333;color:#eee;border:0;border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}
#seek{flex:1}
#time{font-variant-numeric:tabular-nums;min-width:96px;text-align:right;font-size:14px}
#stage { --ground:#FBF6EC; --main:#DD0000; --second:#2B1414; --accent:#F7CF00; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700 } .sub { font-size:36px }
.art { position:absolute; overflow:visible }
.lg-red { fill:var(--main); fill-rule:evenodd }
.lg-yel { fill:var(--accent) }
.lg-dr { fill:var(--main) }
.lg-dy { fill:var(--accent); stroke:color-mix(in srgb, var(--second) 35%, transparent); stroke-width:1.5 }
.lg-spark { fill:none; stroke:var(--accent); stroke-width:9; stroke-linecap:round }
</style></head><body>

4 0Z\",\"M80 768L88 769L93 775L94 783L87 790L81 788L75 780L77 772Z\",\"M284 188L285 198L287 202L287 210L284 216L274 223L263 224L257 227L254 223L261 209L279 191Z\"],\"yel\":[\"M259 454L252 452L245 452L224 462L214 473L212 470L210 462L208 460L205 460L204 461L204 468L214 487L212 489L211 488L191 488L181 492L174 499L171 505L168 518L169 543L176 558L184 571L193 581L201 586L213 589L230 587L240 591L247 590L260 578L272 558L277 545L277 517L278 513L270 501L261 492L254 488L243 485L222 485L217 480L220 472L223 469L227 469L234 472L244 472L261 476L264 479L271 493L273 495L279 497L280 495L275 486L273 467L265 457Z\",\"M284 189L279 192L262 209L256 219L255 224L257 226L263 223L274 222L280 219L283 216L286 210L286 202L284 198Z\"]}", "shared.js": "window.LOGO = {\n  build(kit, id) {\n    const { seg, eio } = kit;\n    const d = kit.json('logo.json');\n    const all = d.red.join('');\n    let sp = '';\n    for (let i = 0; i < 6; i++) {\n      const a = (-170 + i * 32) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);\n      sp += '<path class=\"lg-spark\" pathLength=\"1\" d=\"M' + (225 + c * 100).toFixed(1) + ' ' + (520 + s * 100).toFixed(1) + 'L' + (225 + c * 150).toFixed(1) + ' ' + (520 + s * 150).toFixed(1) + '\"/>';\n    }\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 963 1193\" style=\"left:597px;top:90px;width:726px;height:900px\">' +\n      '<defs><clipPath id=\"' + id + '-c\"><circle class=\"lg-clip\" cx=\"480\" cy=\"700\" r=\"0\"/><\/clipPath><\/defs>' +\n      '<g class=\"lg-g\">' +\n      '<path class=\"lg-red\" clip-path=\"url(#' + id + '-c)\" d=\"' + all + '\"/>' +\n      '<g class=\"lg-ap\"><path class=\"lg-yel\" d=\"' + d.yel[0] + '\"/><\/g>' +\n      '<g class=\"lg-ey\"><path class=\"lg-yel\" d=\"' + d.yel[1] + '\"/><\/g>' +\n      '<g class=\"lg-sp\">' + sp + '<\/g><g class=\"lg-dots\"><\/g><\/g><\/svg>');\n    kit.stage.append(svg);\n    const q = s => svg.querySelector(s);\n    const L = { svg, g: q('.lg-g'), clip: q('.lg-clip'), ap: q('.lg-ap'), ey: q('.lg-ey'), sp: [...svg.querySelectorAll('.lg-spark')], P: [] };\n    L.g.style.transformOrigin = '481px 596px';\n    L.ap.style.transformOrigin = '225px 590px';\n    L.ey.style.transformOrigin = '270px 207px';\n    const rnd = kit.rng(11), dots = q('.lg-dots');\n    const src = [[q('.lg-red'), 240, 0], [q('.lg-ap path'), 64, 1], [q('.lg-ey path'), 12, 2]];\n    for (const [el, n, g] of src) {\n      const len = el.getTotalLength();\n      for (let i = 0; i < n; i++) {\n        const pt = el.getPointAtLength(len * (i + rnd() * 0.6) / n);\n        const sx = -700 + rnd() * 2350, sy = -90 + rnd() * 1370;\n        const dx = pt.x - sx, dy = pt.y - sy, m = Math.hypot(dx, dy) || 1;\n        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');\n        c.setAttribute('class', g === 0 && rnd() < 0.55 ? 'lg-dr' : 'lg-dy');\n        dots.append(c);\n        L.P.push({ el: c, g, tx: pt.x, ty: pt.y, sx, sy, px: -dy / m, py: dx / m, amp: (rnd() - 0.5) * 260, dl: rnd() * 0.7, r: 4.5 + rnd() * 3.5, ph: rnd() * 6.28, dist: Math.hypot(pt.x - 480, pt.y - 700) });\n      }\n    }\n    L.seg = seg; L.eio = eio;\n    return L;\n  },\n  set(L, s) {\n    const n = (v, d) => (v === undefined ? d : v);\n    L.g.style.transform = 'translate(0px,' + n(s.dy, 0) + 'px) scale(' + n(s.scale, 1) + ')';\n    L.clip.setAttribute('r', n(s.flood, 0));\n    L.ap.style.opacity = n(s.apOp, 0);\n    L.ap.style.transform = 'translate(0px,' + n(s.apY, 0) + 'px) scale(' + n(s.apSx, 1) + ',' + n(s.apSy, 1) + ')';\n    L.ey.style.opacity = n(s.eyOp, 0);\n    L.ey.style.transform = 'scale(' + Math.max(0.001, n(s.eyS, 1)) + ')';\n    const sk = n(s.spark, -1);\n    L.sp.forEach((e, i) => {\n      const k = L.seg(sk, i * 0.05, 0.6 + i * 0.05), a = L.eio(k), tail = L.eio(L.seg(k, 0.45, 1));\n      e.style.strokeDasharray = Math.max(0, a - tail) + ' 1';\n      e.style.strokeDashoffset = -tail;\n      e.style.opacity = sk < 0 || a - tail < 0.01 ? 0 : 1;\n    });\n    const pt = n(s.pt, 99), T = n(s.T, 0), kill = n(s.kill, -1), apKill = n(s.apKill, 0);\n    for (const p of L.P) {\n      const u = L.eio(L.seg(pt, p.dl, p.dl + 1.1)), w = Math.sin(Math.PI * u) * p.amp;\n      const x = p.sx + (p.tx - p.sx) * u + p.px * w + Math.sin(T * 5 + p.ph) * 1.8 * u;\n      const y = p.sy + (p.ty - p.sy) * u + p.py * w + Math.cos(T * 4 + p.ph) * 1.8 * u;\n      let sc = 1;\n      if (p.g === 0 && kill >= 0) sc = 1 - L.seg(kill, p.dist - 40, p.dist + 10);\n      if (p.g > 0) sc = 1 - apKill;\n      p.el.setAttribute('cx', x.toFixed(1)); p.el.setAttribute('cy', y.toFixed(1));\n      p.el.setAttribute('r', (p.r * sc * (1.3 - 0.3 * u)).toFixed(2));\n      p.el.style.opacity = sc > 0.01 ? L.seg(pt, p.dl, p.dl + 0.12) : 0;\n    }\n  },\n};", "scene-trace.js": "const { lerp, seg, eo } = kit;\nkit.scene('trace', {\n  init(kit) {\n    kit.stage.append(kit.h('<div class=\"ground\"><\/div>'));\n    this.L = window.LOGO.build(kit, 'trace');\n  },\n  render(t, kit) {\n    window.LOGO.set(this.L, {\n      pt: t + 0.3,\n      T: kit.start + t,\n      scale: lerp(0.97, 1, eo(seg(t, 0, 2))),\n    });\n  },\n});", "scene-fill.js": "const { seg, eio, eob, lerp } = kit;\nkit.scene('fill', {\n  init(kit) {\n    kit.stage.append(kit.h('<div class=\"ground\"><\/div>'));\n    this.L = window.LOGO.build(kit, 'fill');\n  },\n  render(t, kit) {\n    const r = lerp(0, 900, eio(seg(t, 0.15, 1.15)));\n    const pop = eob(seg(t, 0.9, 1.3), 1.7);\n    const bump = Math.sin(Math.PI * seg(t, 0.95, 1.5));\n    window.LOGO.set(this.L, {\n      pt: t + 2.3,\n      T: kit.start + t,\n      flood: r,\n      kill: r,\n      apKill: seg(t, 0.95, 1.25),\n      eyOp: seg(t, 0.75, 0.85),\n      eyS: eob(seg(t, 0.75, 1.1), 1.8),\n      apOp: seg(t, 0.9, 1.0),\n      apSx: lerp(0.6, 1, pop),\n      apSy: lerp(0.6, 1, pop),\n      scale: 1 + 0.012 * bump,\n    });\n  },\n});", "scene-hold.js": "const { seg, eo, lerp } = kit;\nkit.scene('hold', {\n  init(kit) {\n    kit.stage.append(kit.h('<div class=\"ground\"><\/div>'));\n    this.L = window.LOGO.build(kit, 'hold');\n  },\n  render(t, kit) {\n    const b = Math.sin(2 * Math.PI * t / 2.4);\n    window.LOGO.set(this.L, {\n      pt: 99,\n      T: kit.start + t,\n      flood: 900,\n      kill: 900,\n      apKill: 1,\n      eyOp: 1,\n      eyS: 1 + 0.03 * b,\n      apOp: 1,\n      apSx: 1 - 0.008 * b,\n      apSy: 1 + 0.012 * b,\n      spark: seg(t, 0.05, 1.1),\n      scale: lerp(1, 1.03, eo(seg(t, 0, 1.2))),\n    });\n  },\n});"};
const SCENES = [{id:'trace',dur:2},{id:'fill',dur:1.8},{id:'hold',dur:1.2}];
const DURATION = SCENES.reduce((a,s)=>a+s.dur,0);
const W=1920,H=1080,stage=document.getElementById('stage');
/* helpers (same math as the original runtime) */
const clamp01=x=>x<0?0:x>1?1:x, seg=(t,a,b)=>clamp01((t-a)/(b-a)), lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-clamp01(x),3);
const eio=x=>{x=clamp01(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=(x,c1=1.4)=>{x=clamp01(x);const c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function h(html){const t=document.createElement('template');t.innerHTML=String(html).trim();return t.content.firstElementChild}
const base={W,H,seg,lerp,eo,eio,eob,rng,clamp01,h,json:n=>JSON.parse(MODS[n])};
/* shared.js defines window.LOGO */
new Function('kit',MODS['shared.js']).call(window,Object.assign({},base,{stage}));
/* scenes */
let start=0;const defs={};
SCENES.forEach(s=>{
  const box=document.createElement('div');box.className='scene';stage.appendChild(box);
  const kit=Object.assign({},base,{stage:box,start,dur:s.dur,scene:(id,def)=>{defs[id]=def}});
  new Function('kit',MODS['scene-'+s.id+'.js'])(kit);
  defs[s.id].init(kit);defs[s.id].box=box;defs[s.id].kit=kit;defs[s.id].t0=start;
  start+=s.dur;
});
function render(t){
  t=Math.max(0,Math.min(DURATION,t));
  let i=0,acc=0;for(;i<SCENES.length-1&&t>=acc+SCENES[i].dur;i++)acc+=SCENES[i].dur;
  SCENES.forEach((s,k)=>{defs[s.id].box.style.display=k===i?'':'none'});
  const d=defs[SCENES[i].id];d.render(t-acc,d.kit);
}
/* fit + transport */
function fit(){const w=document.getElementById('wrap'),k=Math.min(w.clientWidth/W,w.clientHeight/H);
  stage.style.transform='scale('+k+')';stage.style.left=((w.clientWidth-W*k)/2)+'px';stage.style.top=((w.clientHeight-H*k)/2)+'px'}
addEventListener('resize',fit);fit();
const pp=document.getElementById('pp'),seek=document.getElementById('seek'),tl=document.getElementById('time');
let playing=true,t=0,last=performance.now();
function show(){render(t);seek.value=Math.round(t/DURATION*1000);tl.textContent=t.toFixed(2)+' / '+DURATION.toFixed(2)+' s'}
function loop(now){if(playing){t+=(now-last)/1000;if(t>=DURATION)t=0}last=now;show();requestAnimationFrame(loop)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play'};
seek.oninput=()=>{t=seek.value/1000*DURATION;playing=false;pp.textContent='Play'};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click()}});
requestAnimationFrame(loop);
</script></body></html>
